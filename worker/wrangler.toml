name = "oac-worker"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Exact addresses allowed to connect. Change the first one to your real Pages address.
ALLOWED_ORIGINS = "https://oac-chat.pages.dev,http://localhost:8080"
ROOM_CAP = "150"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIR"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Directory"]
